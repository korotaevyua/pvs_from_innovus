name: Syntax check

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tcl:
    name: Parse every Tcl file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tclsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl

      - name: Check syntax and entry points
        run: tclsh .github/scripts/check_syntax.tcl
